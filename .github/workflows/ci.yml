# CI: тесты на каждый push/PR, образ в GHCR на push в main,
# публикация npm-пакета agentek-youtrack-mcp на тег v*.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        env:
          YOUTRACK_URL: https://test.youtrack.cloud
          YOUTRACK_API_TOKEN: test-token
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q

  docker:
    name: "🐳 Build & push (GHCR)"
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          VERSION=$(python3 -c "exec(open('youtrack_mcp/version.py').read()); print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentek-youtrack-mcp:latest
            ghcr.io/${{ github.repository_owner }}/agentek-youtrack-mcp:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/agentek-youtrack-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=YouTrack MCP
            org.opencontainers.image.description=YouTrack Model Context Protocol Server
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: "📦 Publish npm"
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync package.json version from youtrack_mcp/version.py
        run: |
          VERSION=$(python3 -c "exec(open('youtrack_mcp/version.py').read()); print(__version__)")
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npmjs.org
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
