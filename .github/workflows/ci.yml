# CI: тесты на каждый push/PR, образ в GHCR на push в main,
# публикация npm-пакета agentek-youtrack-mcp на тег v*.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Форк-PR не пускаем на self-hosted раннер: там docker, то есть root на хосте.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: "🧪 Tests"
    runs-on: [self-hosted, agentek]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          pip install -q -r requirements.txt
          # e2e tests require a real YouTrack instance + credentials; excluded here
          python -m pytest -m "not e2e" -q

  docker:
    name: "🐳 Build & push (GHCR)"
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, agentek]
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: ver
        run: |
          VERSION=$(python3 -c "exec(open('youtrack_mcp/version.py').read()); print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"



      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentek-youtrack-mcp:latest
            ghcr.io/${{ github.repository_owner }}/agentek-youtrack-mcp:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/agentek-youtrack-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=YouTrack MCP
            org.opencontainers.image.description=YouTrack Model Context Protocol Server
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  npm:
    name: "📦 Publish npm"
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, agentek]
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync package.json version from youtrack_mcp/version.py
        run: |
          VERSION=$(python3 -c "exec(open('youtrack_mcp/version.py').read()); print(__version__)")
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npmjs.org
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
